[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainpulse"
version = "0.1.0"
description = "Real-time supply chain disruption intelligence platform"
requires-python = ">=3.10"
dependencies = [
    # web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    # auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # databases
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "neo4j>=5.25.0",
    "redis[hiredis]>=5.0.0",
    # kafka
    "aiokafka>=0.11.0",
    "confluent-kafka>=2.4.0",
    # ingest
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.0",
    "tenacity>=8.2.0",
    # nlp / ml
    "spacy>=3.7.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pybloom-live>=4.0.0",
    # utils
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "faker>=30.0.0",
]

[project.optional-dependencies]
torch-cpu = [
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "respx>=0.21.0",
    "testcontainers[postgres,kafka,redis]>=4.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
