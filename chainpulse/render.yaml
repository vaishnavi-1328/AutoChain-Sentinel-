# Render Blueprint — one Web Service (4 procs via supervisord) + one cron keep-alive.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chainpulse
    runtime: docker
    plan: starter            # $7/mo — 512MB RAM, always-on
    region: oregon
    dockerfilePath: ./chainpulse/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      # secrets below set in Render UI:
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GUARDIAN_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ALERTS_ENABLED
        value: "0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: cron
    name: neo4j-keep-alive
    runtime: docker
    plan: starter
    schedule: "0 */12 * * *"   # every 12 hours
    dockerfilePath: ./chainpulse/Dockerfile
    dockerContext: .
    dockerCommand: "python chainpulse/scripts/keep_alive_neo4j.py"
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
