<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChainPulse — Supply Chain Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind first so our CSS overrides it -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/titlebar.css" />
  <link rel="stylesheet" href="./css/map.css" />
  <link rel="stylesheet" href="./css/sidebar.css" />
  <link rel="stylesheet" href="./css/ticker.css" />
  <link rel="stylesheet" href="./css/modal.css" />
  <link rel="stylesheet" href="./css/orders.css" />
</head>
<body class="font-sans">

  <!-- TITLE BAR -->
  <header id="titlebar">
    <div class="tb-left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 22 7v10l-10 5L2 17V7l10-5Z" stroke="var(--accent-cyan)" stroke-width="1.5"/>
      </svg>
      <span class="tb-brand">CHAINPULSE</span>
      <span class="tb-pill">v1.0</span>
      <span class="tb-sep"></span>
      <span class="tb-page">SUPPLY CHAIN INTELLIGENCE</span>
    </div>

    <div class="tb-center">
      <span id="tb-clock" class="tb-mono">--:--:-- UTC</span>
    </div>

    <div class="tb-right">
      <span id="tb-ws-dot" class="tb-dot tb-dot--off" aria-label="WebSocket status"></span>
      <span id="tb-ws-text" class="tb-status-text">CONNECTING</span>
      <span class="tb-sep"></span>
      <span id="tb-event-count" class="tb-badge">0 EVENTS</span>
      <span class="tb-sep"></span>
      <a href="./onboarding.html" class="tb-avatar" title="Account">U</a>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main id="grid">
    <section id="map-region" aria-label="World map">
      <div id="map-canvas"></div>
      <button id="add-order-fab" type="button">+ Add Order</button>
    </section>

    <aside id="sidebar" aria-label="Sidebar">
      <div class="tab-bar">
        <button class="tab active" data-tab="news">News Feed</button>
        <button class="tab" data-tab="orders">My Orders <span class="tab-badge"></span></button>
      </div>

      <!-- NEWS TAB -->
      <div class="tab-panel active" data-tab="news">
        <div id="sidebar-header">
          <div class="sb-row">
            <span class="sb-title">LIVE FEED</span>
            <button id="sb-pause" class="sb-btn" aria-label="Pause feed">⏸ <span id="sb-queue">0</span></button>
          </div>
          <div class="sb-row sb-row--filter">
            <span class="sb-filter-label">Showing:</span>
            <select id="sb-region" class="sb-select">
              <option value="ALL">All Regions</option>
              <option value="AP">Asia Pacific</option>
              <option value="EU">Europe</option>
              <option value="AM">Americas</option>
              <option value="ME">Middle East</option>
            </select>
          </div>
        </div>
        <ul id="sb-list" aria-live="polite"></ul>
      </div>

      <!-- ORDERS TAB -->
      <div class="tab-panel" data-tab="orders">
        <ul id="orders-list" class="orders-list"></ul>
      </div>
    </aside>

    <footer id="statbar">
      <div id="ticker-wrap">
        <div id="ticker-track"></div>
      </div>
      <div id="chips">
        <div class="chip"><span class="chip-label">ACTIVE</span><span id="chip-active" class="chip-val chip-val--cyan">0</span></div>
        <div class="chip"><span class="chip-label">CRITICAL</span><span id="chip-critical" class="chip-val chip-val--critical">0</span></div>
        <div class="chip"><span class="chip-label">HIGH</span><span id="chip-high" class="chip-val chip-val--high">0</span></div>
        <div class="chip"><span class="chip-label">AVG DELAY</span><span id="chip-avg" class="chip-val">0d</span></div>
        <div class="chip"><span class="chip-label">ROUTES</span><span id="chip-routes" class="chip-val">0</span></div>
        <div class="chip orders-at-risk" title="Click to view My Orders">
          <span class="chip-label">MY ORDERS AT RISK</span>
          <span id="chip-orders-risk" class="chip-val">0 / 0</span>
        </div>
      </div>
    </footer>
  </main>

  <!-- Order drawer + overlay -->
  <div id="drawer-overlay"></div>
  <aside id="order-drawer"></aside>

  <!-- Graph modal -->
  <div id="graph-modal" class="hidden" role="dialog" aria-hidden="true"></div>
  <!-- Order analysis modal -->
  <div id="order-modal" class="hidden" role="dialog" aria-hidden="true"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/clock.js"></script>
  <script src="./js/map-manager.js"></script>
  <script src="./js/supplier-markers.js"></script>
  <script src="./js/sidebar-feed.js"></script>
  <script src="./js/stats-updater.js"></script>
  <script src="./js/ticker.js"></script>
  <script src="./js/sidebar-tabs.js"></script>
  <script src="./js/orders-feed.js"></script>
  <script src="./js/order-drawer.js"></script>
  <script src="./js/graph-modal.js"></script>
  <script src="./js/order-analysis-modal.js"></script>
  <script src="./js/toast.js"></script>
  <script src="./js/ws-client.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
